<h1>Count! How much are you excited to join??: <span id="count">0</span></h1>
  <button onclick="increment()">Increment</button>
  <button onclick="decrement()">Decrement</button>
  <button onclick="reset()">Reset</button>

  <script>
    let count = 0;
    
    function increment() {
      count++;
      updateDisplay();
    }
    
    function decrement() {
      count--;
      updateDisplay();
    }
    
    function reset() {
      count = 0;
      updateDisplay();
    }
    
    function updateDisplay() {
      document.getElementById('count').textContent = count;
    }
  </script>
