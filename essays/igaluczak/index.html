<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Torre Velasca</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="mystyle.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
 
        <header class="top-bar">
            <a href="https://www.unimi.it/">
                <img src="imgs/minerva-34.png" alt="Minerva Logo" title="minerva logo">
            </a>
            <span>MA COM / Minerva</span>
        </header>

        <div class="hero-image">
            <h1>Welcome!</h1>
            <h2>See the amazing Torre Velasca!</h2>
        </div>

        <div class="main">
            <p>Your Gateway to Torre Velasca</p>
            <ul>
                <li><a href="https://www.unimi.it/">University of Milan</a></li>
                <li><a href="https://www.spes.unimi.it/">SPeS</a></li>
                <li><a href="https://www.comune.milano.it/">City of Milan</a></li>
            </ul>
            <iframe width="500" height="345" src="https://www.youtube.com/embed/xQUY4q29WXA"></iframe>
        </div>

        <h1>Count: <span id="count">0</span></h1>
        <button onclick="increment()">Increment</button>
        <button onclick="decrement()">Decrement</button>
        <button onclick="reset()">Reset</button>

        <script>
            let count = 0;
            
            function increment() {
              count++;
              updateDisplay();
            }
            
            function decrement() {
              count--;
              updateDisplay();
            }
            
            function reset() {
              count = 0;
              updateDisplay();
            }
            
            function updateDisplay() {
              document.getElementById('count').textContent = count;
            }
        </script>
    </body>
</html>
