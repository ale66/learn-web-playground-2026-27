<!DOCTYPE html>
<html lang="it">
<head>

<body>

    <!-- Hero Section con sfondo Torre Velasca -->

                    height="100%" 
                    style="border:0;" 
                    allowfullscreen=""

                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- Colonna Destra: Video YouTube funzionante per embedding -->
<div class="media-box">
    <iframe 
        width="100%"

</div>
